name: Android CI

on:
  push:
    branches: [master, "feat/**"]
  pull_request:
  workflow_dispatch:

env:
  APPID: de.szalkowski.activitylauncher.oss

permissions:
  contents: read
  actions: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Check code formatting
        run: ./gradlew spotlessCheck --build-cache
      - name: Run unit tests
        run: ./gradlew testOssNoadsDebugUnitTest --build-cache

  build-debug:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew assembleOssNoadsDebug -PAPPID=de.szalkowski.activitylauncher.oss --build-cache
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug.apk
          path: app/build/outputs/apk/ossNoads/debug/app-oss-noads-debug.apk

  instrumented-tests:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumented integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: "37.0"
          arch: x86_64
          target: google_apis
          profile: small_phone
          disk-size: 5120M
          ram-size: 2048M
          disable-animations: true
          script: bash scripts/run_instrumented_tests.sh
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/

  upgrade-compatibility-test:
    needs: build-debug
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 21
      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: debug.apk
          path: app/build/outputs/apk/ossNoads/debug/
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run release upgrade & shortcut compatibility test
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPID: de.szalkowski.activitylauncher.oss
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: "37.0"
          arch: x86_64
          target: google_apis
          profile: small_phone
          disk-size: 5120M
          ram-size: 2048M
          disable-animations: true
          script: bash scripts/run_upgrade_test.sh
      - name: Upload upgrade test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-test-artifacts
          path: upgrade-test-artifacts/
